name: secure-ci

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_sign:
        description: "Skip signing the image (test scenario)"
        required: false
        type: boolean
        default: false
      skip_provenance:
        description: "Skip build provenance (test scenario)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  code-scan:
    name: Code and secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Semgrep (SAST)
        run: |
          python -m pip install semgrep
          semgrep scan --config p/default --json --output semgrep.json

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-semgrep
          path: semgrep.json
          if-no-files-found: warn

      - name: Gitleaks (secrets)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            zricethezav/gitleaks:v8.24.2 \
            detect --source=/repo --report-format=json \
            --report-path=/repo/gitleaks.json --exit-code=0 --redact=100

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-gitleaks
          path: gitleaks.json
          if-no-files-found: warn

  dep-scan:
    name: Dependency scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-deps.json
          exit-code: "0"

      - name: Upload Trivy dependency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-dependencies
          path: trivy-deps.json
          if-no-files-found: warn

  build-sign:
    name: Build, scan, sign, and attest image
    needs:
      - code-scan
      - dep-scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Lowercase image name
        id: image
        shell: bash
        run: |
          IMAGE="${REGISTRY}/${GITHUB_REPOSITORY,,}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.image }}:secure-${{ github.sha }}

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.image }}@${{ steps.build.outputs.digest }}
          format: cosign-vuln
          output: vuln.cosign.json
          exit-code: "0"

      - name: Upload Trivy image report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-image-vulnerabilities
          path: vuln.cosign.json
          if-no-files-found: warn

      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@v0.18.0
        with:
          image: ${{ steps.image.outputs.image }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Upload SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-sbom
          path: sbom.cdx.json
          if-no-files-found: warn

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1

      - name: Sign image
        if: ${{ inputs.skip_sign != true }}
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      - name: Attest SBOM and vulnerability report
        env:
          IMAGE: ${{ steps.image.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          IMG="$IMAGE@$DIGEST"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$IMG"
          cosign attest --yes --type vuln --predicate vuln.cosign.json "$IMG"

      - name: Attest build provenance
        if: ${{ inputs.skip_provenance != true }}
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ steps.image.outputs.image }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  verify:
    name: Verify image evidence
    needs: build-sign
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      attestations: read
    steps:
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.1

      - name: Log in to GHCR for verification
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify image signature
        id: verify-signature
        env:
          IMAGE: ${{ needs.build-sign.outputs.image }}
          DIGEST: ${{ needs.build-sign.outputs.digest }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/secure-ci.yml@.*
          OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          cosign verify \
            --certificate-identity-regexp "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            "$IMAGE@$DIGEST" | tee signature-verify.json

      - name: Verify SBOM attestation
        id: verify-sbom
        env:
          IMAGE: ${{ needs.build-sign.outputs.image }}
          DIGEST: ${{ needs.build-sign.outputs.digest }}
          CERTIFICATE_IDENTITY: https://github.com/${{ github.repository }}/.github/workflows/secure-ci.yml@.*
          OIDC_ISSUER: https://token.actions.githubusercontent.com
        run: |
          cosign verify-attestation --type cyclonedx \
            --certificate-identity-regexp "$CERTIFICATE_IDENTITY" \
            --certificate-oidc-issuer "$OIDC_ISSUER" \
            "$IMAGE@$DIGEST" | tee sbom-verify.json

      - name: Verify build provenance
        id: verify-provenance
        if: ${{ inputs.skip_provenance != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.build-sign.outputs.image }}
          DIGEST: ${{ needs.build-sign.outputs.digest }}
          OWNER: ${{ github.repository_owner }}
        run: |
          gh attestation verify "oci://$IMAGE@$DIGEST" --owner "$OWNER" | tee provenance-verify.txt

      - name: Record verification results
        if: always()
        env:
          SKIP_SIGN: ${{ inputs.skip_sign && 'true' || 'false' }}
          SKIP_PROVENANCE: ${{ inputs.skip_provenance && 'true' || 'false' }}
          SIGNATURE_RESULT: ${{ steps.verify-signature.outcome }}
          SBOM_RESULT: ${{ steps.verify-sbom.outcome }}
          PROVENANCE_RESULT: ${{ steps.verify-provenance.outcome }}
        run: |
          printf '{\n  "skip_sign": %s,\n  "skip_provenance": %s,\n  "signature_verification": "%s",\n  "sbom_verification": "%s",\n  "provenance_verification": "%s"\n}\n' \
            "$SKIP_SIGN" "$SKIP_PROVENANCE" "$SIGNATURE_RESULT" "$SBOM_RESULT" "$PROVENANCE_RESULT" \
            > verification.json

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-verification
          path: |
            signature-verify.json
            sbom-verify.json
            provenance-verify.txt
            verification.json
          if-no-files-found: warn