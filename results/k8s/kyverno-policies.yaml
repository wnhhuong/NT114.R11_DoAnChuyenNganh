  spec:
    admission: true
    background: false
    emitWarning: false
    failurePolicy: Fail
    rules:
    - imageExtractors:
        Rollout:
        - path: /spec/template/spec/containers/*/image
      match:
        any:
        - resources:
            kinds:
            - Pod
            - argoproj.io/v1alpha1/Rollout
            namespaces:
            - demo
      name: signature-and-trust-decision
      skipBackgroundRequests: true
      verifyImages:
      - attestations:
        - attestors:
          - entries:
            - keyless:
                issuer: https://token.actions.githubusercontent.com
                rekor:
                  url: https://rekor.sigstore.dev
                subject: https://github.com/wnhhuong/NT114.R11_DoAnChuyenNganh/.github/workflows/secure-ci.yml@refs/heads/main
              signatureAlgorithm: sha256
          conditions:
          - all:
