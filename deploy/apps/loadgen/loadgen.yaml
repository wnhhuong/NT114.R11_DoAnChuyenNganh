# Tạo traffic liên tục vào cả bản stable và canary để AnalysisTemplate có số liệu
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgen
spec:
  replicas: 1
  selector:
    matchLabels: { app: loadgen }
  template:
    metadata:
      labels: { app: loadgen }
    spec:
      containers:
        - name: curl
          image: curlimages/curl:8.11.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                curl -s -o /dev/null http://demo-app.demo.svc:8080/hello
                curl -s -o /dev/null http://demo-app-canary.demo.svc:8080/hello
                sleep 0.2
              done
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 32Mi }
