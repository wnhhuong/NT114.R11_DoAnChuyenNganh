apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: demo-app
  labels:
    app: demo-app
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: demo-app            # kustomize thay bằng harbor...@sha256:<digest>
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DEMO_ERROR_RATE
              value: "0.5"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75"
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          # tcpSocket: chạy được với cả image cũ (#25, chưa có actuator) lẫn image mới
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 60
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp       # Tomcat cần ghi file tạm
      volumes:
        - name: tmp
          emptyDir: {}
  strategy:
    canary:
      stableService: demo-app
      canaryService: demo-app-canary
      steps:
        - setWeight: 50
        - pause: { duration: 30s }
        - analysis:
            templates:
              - templateName: success-rate
