# Profile chặt hơn: dùng để so sánh trong báo cáo (cùng evidence, policy khác => quyết định khác)
apiVersion: trust.nt114/v1
kind: SecurityPolicy
metadata:
  name: strict
  version: "1.0.0"
  description: Như default, nhưng SAST ERROR, báo cáo lỗ hổng chưa ký, evidence cũ, MEDIUM > 0 đều bị chặn.

identity:
  repository: wnhhuong/NT114.R11_DoAnChuyenNganh
  workflow_path: .github/workflows/secure-ci.yml
  allowed_refs: [refs/heads/main]
  oidc_issuer: https://token.actions.githubusercontent.com
  allowed_triggers: [push]            # không chấp nhận build chạy tay

evidence:
  action: block
  required: [verification, signature, sbom_attestation, vuln_attestation, provenance, sbom, vuln_report, semgrep, gitleaks, trivy_deps]

rules:
  signature: { action: block }
  sbom: { action: block, min_components: 10, uploaded_mismatch_action: block }
  provenance: { action: block, missing_detail_action: block, require_github_hosted: true }
  vulnerabilities:
    action: block
    max: { CRITICAL: 0, HIGH: 0, MEDIUM: 0 }
    warn_above: { LOW: 0, UNKNOWN: 0 }
    ignore_unfixed: false
    signed_report_action: block
    uploaded_mismatch_action: block
    max_age_days: 1
    freshness_action: block
    exceptions: []
  dependencies: { action: block, max: { CRITICAL: 0, HIGH: 0 }, coverage_action: block }
  secrets: { action: block, max_findings: 0 }
  sast: { action: block, max: { ERROR: 0 } }
  consistency: { action: block }

scoring:
  weights: { signature: 25, provenance: 25, sbom: 15, vulnerabilities: 25, secrets: 10 }
