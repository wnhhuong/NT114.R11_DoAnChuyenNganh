# ESO đọc secret từ HashiCorp Vault (KV v2 tại secret/), đăng nhập bằng Kubernetes auth:
# token ServiceAccount external-secrets => role "external-secrets" => policy nt114-eso-read (chỉ đọc nt114/*)
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: http://vault.vault.svc.cluster.local:8200
      path: secret
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
            audiences: [vault]      # token chỉ dùng được cho Vault (khớp audience của role)
