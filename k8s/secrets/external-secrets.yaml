# Mỗi ExternalSecret tạo một K8s Secret từ Vault (secret/nt114/...); refresh mỗi giờ
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef: { key: nt114/grafana-admin, property: username }
    - secretKey: admin-password
      remoteRef: { key: nt114/grafana-admin, property: password }
---
